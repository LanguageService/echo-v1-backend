<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}LET US ECHO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#0b0f19;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f3f4f6;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b0f19;padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Email card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#111827;border-radius:16px;overflow:hidden;border:1px solid #1f2937;box-shadow:0 10px 30px rgba(0,0,0,0.5);">

          <!-- ── Header ── -->
          <tr>
            <td style="padding:40px 40px 24px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <!-- Logo mark -->
                    <div style="display:inline-block;padding:0px;margin-bottom:0px;">
                      <img src="{{ frontend_url|default:'https://echo.com' }}/images/logo.png" alt="LetEcho" width="120" style="display:block;border:0;border-radius:12px;box-shadow:0 0 20px rgba(124,58,237,0.4);" />
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #374151;margin:0;" />
            </td>
          </tr>

          <!-- ── Body ── -->
          <tr>
            <td style="padding:40px 40px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #374151;margin:0;" />
            </td>
          </tr>

          <!-- ── Footer ── -->
          <tr>
            <td style="padding:24px 40px 32px;text-align:center;">
              <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;">
                You're receiving this email because you have an account with LET US ECHO.
              </p>
              <p style="margin:0;font-size:12px;color:#6b7280;">
                &copy; {% now "Y" %} LET US ECHO. All rights reserved.<br />
                <a href="#" style="color:#f97316;text-decoration:none;">Privacy Policy</a>
                &nbsp;&middot;&nbsp;
                <a href="#" style="color:#f97316;text-decoration:none;">Terms of Service</a>
              </p>
            </td>
          </tr>

        </table><!-- /card -->

      </td>
    </tr>
  </table><!-- /wrapper -->

</body>
</html>
