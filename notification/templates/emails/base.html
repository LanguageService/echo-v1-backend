<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}LET US ECHO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif;color:#374151;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Email card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.06);">

          <!-- ── Header ── -->
          <tr>
            <td style="padding:40px 40px 24px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <!-- Logo mark -->
                    <div style="display:inline-block;padding:0px;margin-bottom:0px;">
                      <img src="{{ frontend_url|default:'https://echo.com' }}/images/logo.png" alt="LetEcho" width="120" style="display:block;border:0;border-radius:12px;" />
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #f3f4f6;margin:0;" />
            </td>
          </tr>

          <!-- ── Body ── -->
          <tr>
            <td style="padding:40px 40px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #f3f4f6;margin:0;" />
            </td>
          </tr>

          <!-- ── Footer ── -->
          <tr>
            <td style="padding:24px 40px 32px;text-align:center;">
              <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;">
                You're receiving this email because you have an account with LET US ECHO.
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                &copy; {% now "Y" %} LET US ECHO. All rights reserved.<br />
                <a href="#" style="color:#f97316;text-decoration:none;">Privacy Policy</a>
                &nbsp;&middot;&nbsp;
                <a href="#" style="color:#f97316;text-decoration:none;">Terms of Service</a>
              </p>
            </td>
          </tr>

        </table><!-- /card -->

      </td>
    </tr>
  </table><!-- /wrapper -->

</body>
</html>
