<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}ECHO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f8;padding:32px 0;">
    <tr>
      <td align="center">

        <!-- Email card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- ── Header ── -->
          <tr>
            <td style="background:linear-gradient(135deg,#7C3AED 0%,#4F46E5 100%);padding:32px 40px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <!-- Logo mark -->
                    <div style="display:inline-block;background:rgba(255,255,255,0.15);border-radius:12px;padding:10px 18px;margin-bottom:12px;">
                      <span style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">⚡ ECHO</span>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Body ── -->
          <tr>
            <td style="padding:40px 40px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #ede9fe;margin:0;" />
            </td>
          </tr>

          <!-- ── Footer ── -->
          <tr>
            <td style="padding:24px 40px 32px;text-align:center;">
              <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">
                You're receiving this email because you have an account with ECHO.
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                &copy; {% now "Y" %} ECHO. All rights reserved.<br />
                <a href="#" style="color:#7C3AED;text-decoration:none;">Privacy Policy</a>
                &nbsp;&middot;&nbsp;
                <a href="#" style="color:#7C3AED;text-decoration:none;">Terms of Service</a>
              </p>
            </td>
          </tr>

        </table><!-- /card -->

      </td>
    </tr>
  </table><!-- /wrapper -->

</body>
</html>
