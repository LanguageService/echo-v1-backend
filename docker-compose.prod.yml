# ── Shared environment ────────────────────────────────────────────────────────
x-app-env: &app-env
  # In production, we expect these to be supplied via an .env file on the EC2 instance
  ENV_MODE: "prod"
  DEBUG: "False"
  # DATABASE_URL: Should be supplied in .env
  # REDIS_URL: Will default to the local redis container
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

# ── Services ──────────────────────────────────────────────────────────────────
services:
  redis:
    image: redis:7-alpine
    container_name: echo_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Only expose to localhost on the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: echo_web
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    env_file:
      - .env
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_volume:/app/staticfiles_build
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: echo_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: echo_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  static_volume:
